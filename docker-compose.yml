version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-broker
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - compliance-net

  opa:
    image: openpolicyagent/opa:latest
    container_name: opa-engine
    command:
      - run
      - --server
      - --addr
      - :8181
      - /policy.rego
      - --log-level=debug
    volumes:
      - ./policy.rego:/policy.rego:ro
    ports:
      - "8181:8181"
    networks:
      - compliance-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - compliance-net
    depends_on:
      - sidecar

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ./config/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - compliance-net
    depends_on:
      - prometheus

  postgres:
    image: postgres:15-alpine
    container_name: compliance-postgres
    environment:
      POSTGRES_DB: compliance_audit
      POSTGRES_USER: compliance_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # set in .env.local
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/database/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - compliance-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_user -d compliance_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: deployment/containers/Containerfile
    container_name: sidecar-agent
    volumes:
      - ./enterprise.db:/app/enterprise.db
      - ./policy.rego:/app/policy.rego:rw
      - ./policy_metadata.json:/app/policy_metadata.json:rw
      - ./policies:/app/policies:ro
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - USE_POSTGRES=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=compliance_audit
      - POSTGRES_USER=compliance_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APL_ENABLED=true
      - CMF_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_INPUT_TOPIC=agent.requests
      - KAFKA_OUTPUT_TOPIC=read.responses
      # ── LLM tier (GAP-35 correctness fix) ──────────────────────────────────
      # Default: local inference via the bundled Ollama service so that
      # no agent payload ever reaches an external cloud model.
      # Override with docker-compose.llm.yml for cloud-LLM experiments.
      - LLM_VALIDATION_ENABLED=true
      - LLM_MODEL=ollama/granite3.2:2b
      - LITELLM_BASE_URL=http://ollama:11434
      # Cloud API keys intentionally absent from the base compose; supply
      # via docker-compose.llm.yml or a .env override.
      - LLM_TEMPERATURE=0.0
      - LLM_VALIDATION_TIMEOUT=30.0
      - LLM_CACHE_ENABLED=true
      # PII is redacted before the event reaches the LLM validator.
      # Set REDACT_FOR_LLM=false ONLY for unit-test payloads that need raw data.
      - REDACT_FOR_LLM=true
      # ── Escalation / delegation ─────────────────────────────────────────────
      - ENABLE_TIER_ESCALATION=true
      - ENABLE_CMF_TO_LLM_ESCALATION=true
      - ENABLE_OPA_ESCALATION=true
      - ENABLE_STATEFUL_ESCALATION=true
      - CMF_PII_ESCALATION_THRESHOLD=HIGH
      - ENABLE_HUMAN_DELEGATION=true
      # Demo 4 — Hybrid mode (default off; activated by docker-compose-hybrid.yml override)
      - HYBRID_MODE=false
      - GATEWAY_UPSTREAM_URL=
    env_file:
      - s3-config.env
    networks:
      - compliance-net
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      opa:
        condition: service_started
    restart: unless-stopped

  # ── Local inference (GAP-35: local-model as default) ─────────────────────
  # ollama/ollama is available as a plain OCI image and runs under podman
  # with no additional runtime flags.  Model files are persisted in the
  # named volume below so they survive container restarts.
  #
  # Pull the model on first run (one-time):
  #   podman exec ollama ollama pull granite3.2:2b
  #
  # To switch to a cloud LLM for benchmarking, use the override file:
  #   podman compose -f docker-compose.yml -f docker-compose.llm.yml up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - compliance-net
    restart: unless-stopped

  mcp-proxy:
    build:
      context: .
      dockerfile: deployment/containers/Containerfile.mcp
    container_name: mcp-compliance-proxy
    ports:
      - "3000:3000"
    environment:
      - COMPLIANCE_SIDECAR_URL=http://sidecar:8080
      - MCP_PROXY_PORT=3000
      - COMPLIANCE_AGENT_ID=mcp-proxy-001
      - MCP_SERVERS={"filesystem":"http://mcp-file-server:3001","database":"http://mcp-db-server:3002","api":"http://mcp-api-server:3003"}
    networks:
      - compliance-net
    depends_on:
      - sidecar
    restart: unless-stopped

  mcp-file-server:
    image: mcp/file-server:latest
    container_name: mcp-file-server
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data:ro
      - ./workspace:/workspace:rw
    networks:
      - compliance-net
    restart: unless-stopped

  mcp-db-server:
    image: mcp/database-server:latest
    container_name: mcp-db-server
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=compliance_audit
      - DB_USER=compliance_user
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - compliance-net
    depends_on:
      - postgres
    restart: unless-stopped

  mcp-api-server:
    image: mcp/api-server:latest
    container_name: mcp-api-server
    ports:
      - "3003:3003"
    networks:
      - compliance-net
    restart: unless-stopped

networks:
  compliance-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  ollama-models:

