apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Use Docker service name for container-to-container communication
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: POST
    version: 1

