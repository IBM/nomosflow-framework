# deploy/envoy/envoy.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Envoy proxy configuration for the EXP-7 baseline comparison.
#
# Architecture
# ─────────────────
#   Client → Envoy :10000
#               ↓ ext_authz (gRPC-gateway → HTTP call)
#             OPA  :8181  /v1/data/bank/authz
#               ↓ allow / deny
#           Upstream :8080
#
# Usage (docker / podman)
# ─────────────────────────
#   podman run --rm -p 10000:10000 \
#     -v $(pwd)/deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro \
#     docker.io/envoyproxy/envoy:v1.29-latest
#
# The ext_authz filter calls OPA over HTTP.  Envoy converts every inbound HTTP
# request to a CheckRequest and sends it to OPA; OPA's JSON response
# {"result": {"allow": true/false}} is mapped to HTTP 200 / 403.
#
# For the paper experiment (exp7_baselines/envoy_probe.py) the container is
# optional — the probe can call OPA directly and annotate the result as
# "ENVOY_OPA_GATEWAY" baseline latency.
# ──────────────────────────────────────────────────────────────────────────────
static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                http_filters:
                  # ── ext_authz: delegate to OPA ──────────────────────────────
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: http://opa:8181
                          cluster: opa_cluster
                          timeout: 2s
                        path_prefix: /v1/data/bank/authz
                        authorization_request:
                          headers_to_add:
                            - key: Content-Type
                              value: application/json
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-authz-decision
                      failure_mode_allow: false
                  # ── router: forward to upstream ─────────────────────────────
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: upstream_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: upstream_cluster

  clusters:
    # ── OPA policy decision endpoint ─────────────────────────────────────────
    - name: opa_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: opa_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: opa
                      port_value: 8181

    # ── Upstream application service ─────────────────────────────────────────
    - name: upstream_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: upstream_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: upstream
                      port_value: 8080

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
